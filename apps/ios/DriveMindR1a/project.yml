name: DriveMindR1a
options:
  bundleIdPrefix: com.agentfeedoptimization
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  DriveMindR1a:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentfeedoptimization.drivemind.r1a
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: DriveMind
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        CODE_SIGN_STYLE: Automatic
schemes:
  DriveMindR1a:
    build:
      targets:
        DriveMindR1a: all
